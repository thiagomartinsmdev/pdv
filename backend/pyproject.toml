# Configuração das ferramentas de qualidade de código.
# (As dependências ficam no requirements.txt.)

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Models, schemas e configs são classes de dados, sem métodos — esse aviso não se aplica.
disable = ["too-few-public-methods"]
